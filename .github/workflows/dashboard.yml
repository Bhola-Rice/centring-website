name: Dashboard checks
on:
  push:
    branches: [main, 'dashboard/**']
    paths: ['dashboard/**', '.github/workflows/dashboard.yml']
  pull_request:
    paths: ['dashboard/**', '.github/workflows/dashboard.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-worker-${{ github.sha }}
          path: dashboard/dist/
          include-hidden-files: true
          retention-days: 14
